# Complete Netband configuration using the v1 defaults.
console = "auto"
verbosity = "info"
interfaces = []
output = "netband.csv"
shutdown_grace = "30s"

[ping]
targets = ["1.1.1.1", "8.8.8.8", "9.9.9.9"]
interval = "5s"
timeout = "2s"

[bandwidth]
provider = "mlab"
daily_max = 4
min_spacing = "36m"
slot_jitter_pct = 50
whole_test_timeout = "55s"
shutdown_margin = "15s"
# Change only after reviewing PRIVACY.md and both linked M-Lab policies.
accept_mlab_policy = false

[bandwidth.trigger]
window_rounds = 6
min_samples = 6
loss_threshold_pct = 50.0
# Uncomment to trigger on p95 latency as well as loss.
# rtt_threshold_ms = 250.0
recovery_loss_pct = 10.0
recovery_rounds = 3
pending_ttl = "30m"

[bandwidth.cooldown]
initial = "60s"
max = "16m"

[bandwidth.mlab]
locate_url = "https://locate.measurementlab.net/v2/nearest/ndt/ndt7"
