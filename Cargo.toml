[package]
name = "netband"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Continuous network latency and bandwidth measurement daemon"
license = "Apache-2.0"
repository = "https://github.com/gregl83/netband"
readme = "README.md"
keywords = ["network", "latency", "bandwidth", "monitoring", "ndt7"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
humantime = "2.4.0"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
toml = "1.1.4"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
