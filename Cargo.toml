[package]
name = "netband"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Continuous network latency and bandwidth measurement daemon"
license = "Apache-2.0"
repository = "https://github.com/gregl83/netband"
readme = "README.md"
keywords = ["network", "latency", "bandwidth", "monitoring", "ndt7"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
directories = "6.0.0"
humantime = "2.4.0"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
