
<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 110 412 290" width="100%" height="100%">
    <defs>
        <!-- High-Tech Blue-Green to Orange Gradient -->
        <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00D2FF" />
            <stop offset="50%" stop-color="#00E676" />
            <stop offset="100%" stop-color="#FF6D00" />
        </linearGradient>

        <!-- Ring Gradient -->
        <linearGradient id="ring-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#FF6D00" stop-opacity="0.4" />
        </linearGradient>
    </defs>

    <!-- Outer Network Rings with dark stroke backing for contrast on white -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#0B132B" stroke-width="12" stroke-dasharray="8 8" />
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ring-grad)" stroke-width="6" stroke-dasharray="8 8" />

    <circle cx="256" cy="256" r="110" fill="none" stroke="#0B132B" stroke-width="6" />
    <circle cx="256" cy="256" r="110" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.6" />

    <!-- Heartbeat / Jitter Pulse Line Backing Path (Dark contrast outline) -->
    <path d="M 64,256 L 150,256 L 170,220 L 190,280 L 210,130 L 245,370 L 275,180 L 295,290 L 315,230 L 335,260 L 360,210 L 375,256 L 448,256"
          fill="none"
          stroke="#0B132B"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Heartbeat / Jitter Pulse Foreground Line -->
    <path d="M 64,256 L 150,256 L 170,220 L 190,280 L 210,130 L 245,370 L 275,180 L 295,290 L 315,230 L 335,260 L 360,210 L 375,256 L 448,256"
          fill="none"
          stroke="url(#pulse-grad)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Network Node Points with dark borders -->
    <circle cx="210" cy="130" r="9" fill="#0B132B" />
    <circle cx="210" cy="130" r="6" fill="#00D2FF" />

    <circle cx="245" cy="370" r="9" fill="#0B132B" />
    <circle cx="245" cy="370" r="6" fill="#00E676" />

    <circle cx="275" cy="180" r="9" fill="#0B132B" />
    <circle cx="275" cy="180" r="6" fill="#FF6D00" />

    <!-- Entry/Exit Connection Nodes -->
    <circle cx="64" cy="256" r="7" fill="#0B132B" />
    <circle cx="64" cy="256" r="4" fill="#00D2FF" />

    <circle cx="448" cy="256" r="7" fill="#0B132B" />
    <circle cx="448" cy="256" r="4" fill="#FF6D00" />
</svg>
