name: CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to prepare (for example, 1.0.0)'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-release:
    name: Verify release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-31
        with:
          toolchain: "1.98.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-verification
      - name: Verify release tag matches the crate version
        shell: bash
        env:
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          crate_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "netband") | .version')"
          expected_tag="v${crate_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag '${RELEASE_TAG}' does not match crate version '${expected_tag}'." >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: python3 -m unittest discover -s scripts -p test_release.py
      - run: bash scripts/smoke-installer-linux.sh
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Verify crate package
        run: cargo package --locked --target-dir "$RUNNER_TEMP/netband-package"

  build-release-binaries:
    name: Build ${{ matrix.target }} release binary
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 "${{ matrix.target }}"
      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo +1.98.0 build --release --locked --target "${{ matrix.target }}"
      - name: Package release asset
        shell: bash
        run: |
          target="${{ matrix.target }}"
          asset="netband-${target}.tar.gz"
          mkdir -p stage dist
          install -m 0755 "target/${target}/release/netband" stage/netband
          tar -C stage -czf "dist/${asset}" netband
          (cd dist && sha256sum "${asset}" >"${asset}.sha256")
          if [[ "${target}" == "x86_64-unknown-linux-gnu" ]]; then
            install -m 0644 install.sh dist/netband-installer.sh
            install -m 0644 packaging/netband.toml dist/netband.toml
            install -m 0644 packaging/netband.service dist/netband.service
          fi
      - name: Smoke test the packaged executable
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          target="${{ matrix.target }}"
          mkdir extracted
          (cd dist && sha256sum --check "netband-${target}.tar.gz.sha256")
          tar -xzf "dist/netband-${target}.tar.gz" -C extracted
          if [[ "$target" == "aarch64-unknown-linux-gnu" ]]; then
            bash scripts/smoke-aarch64-linux.sh extracted/netband
            qemu-aarch64 -L /usr/aarch64-linux-gnu extracted/netband --version | grep -Fx "netband $RELEASE_VERSION"
          else
            binary="$PWD/extracted/netband"
            "$binary" --version | grep -Fx "netband $RELEASE_VERSION"
            "$binary" --help >/dev/null
            work="$(mktemp -d)"
            (cd "$work" && "$binary" config check >config.txt 2>config.err)
            test ! -s "$work/config.err"
            grep -Fx 'configuration=valid' "$work/config.txt"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  prepare-release:
    name: Prepare GitHub draft release
    needs: build-release-binaries
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Create or update the verified draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          python3 scripts/release.py prepare --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --assets dist
          echo "Draft $RELEASE_TAG is ready for review. Publish it manually after reviewing this run and its release notes." >>"$GITHUB_STEP_SUMMARY"

  publish-crate:
    name: Publish crate (final)
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      attestations: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify prepared release assets and source version
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$RELEASE_TAG" = "v$version"
          assets="$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --dir "$assets"
          python3 scripts/release.py verify --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --assets "$assets"
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Check crates.io publication state
        id: crate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          status="$(curl \
            --user-agent "netband-release-workflow" \
            --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/netband/${version}")"
          case "$status" in
            200)
              echo "published=true" >>"$GITHUB_OUTPUT"
              echo "netband ${version} is already published; skipping cargo publish."
              ;;
            404)
              echo "published=false" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io response: HTTP ${status}" >&2
              exit 1
              ;;
          esac
      - name: Publish to crates.io
        if: steps.crate.outputs.published != 'true'
        run: cargo +1.98.0 publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
